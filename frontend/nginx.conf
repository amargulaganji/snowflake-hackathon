server {
    listen 80;
    server_name localhost;

    # Serve the React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /members {
        proxy_pass http://127.0.0.1:8000/members;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Sf-Context-Current-User $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_read_timeout 120s;
    }

    location /ask {
        proxy_pass http://127.0.0.1:8000/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Sf-Context-Current-User $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /documents {
        proxy_pass http://127.0.0.1:8000/documents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Sf-Context-Current-User $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /studio {
        proxy_pass http://127.0.0.1:8000/studio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Sf-Context-Current-User $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_read_timeout 120s;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Sf-Context-Current-User $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_read_timeout 120s;
    }

    location /auth {
        proxy_pass http://127.0.0.1:8000/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Sf-Context-Current-User $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_read_timeout 120s;
    }
}
